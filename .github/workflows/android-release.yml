name: Android release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: /usr/local/share/vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up native Android dependencies
        run: bash ./.ci/setup-android.sh

      - name: Build unsigned reldebug APK
        run: bash ./.ci/build-android.sh artifacts/vita3k-nss

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: vita3k-nss-${{ github.sha }}
          path: artifacts/vita3k-nss/app.apk

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            NSS (Experimental) is a no-cost, shader-only screen reconstruction pass.
            It is not NVIDIA DLSS and does not include proprietary NVIDIA code or models.
          files: artifacts/vita3k-nss/app.apk